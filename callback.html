<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ReplyRaven is your calm, intelligent workspace for Google reviews. Unlimited locations. Thoughtful AI replies. Your own Google Sheet."
    />
    <meta name="theme-color" content="#7c5ce5" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Google authorization · ReplyRaven</title>
    <link rel="icon" type="image/svg+xml" href="assets/raven.svg" />
    <script src="auth.js" data-page="callback"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script>
      if (window.tailwind)
        tailwind.config = {
          darkMode: 'class',
          theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } },
        };
    </script>
    <script defer src="assets/lucide.min.js"></script>
    <script async src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body class="callback-page" data-page="callback">
    <a class="logo" href="index.html" aria-label="ReplyRaven home"
      ><img src="assets/raven.svg" alt="" width="40" height="40" /><span>Reply<span>Raven</span></span></a
    >
    <main id="main" class="panel callback-card">
      <div id="callback-root">
        <div class="loading-state">
          <i data-lucide="loader-circle" class="icon spin" aria-hidden="true"></i>
          <h3>Preparing your Google authorization…</h3>
        </div>
      </div>
    </main>
    <p class="callback-footer">
      Your authorization code is temporary and can only be used once. Never share it, your refresh token, or
      your client secret.
    </p>
    <div id="modal-root"></div>
    <div id="toast-stack" class="toast-stack" aria-live="polite" aria-atomic="false"></div>
    <noscript
      ><div class="notice warning">
        ReplyRaven needs JavaScript to connect Google and manage reviews. Please enable it in your browser.
      </div></noscript
    >
  </body>
</html>
