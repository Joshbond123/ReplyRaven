<!doctype html>
<html lang="en">
  <head>
    <title>Notifications · ReplyRaven</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ReplyRaven learns your brand voice and turns Google reviews into thoughtful owner replies. Manage businesses, billing, and notifications in one workspace."
    />
    <meta name="theme-color" content="#7c5ce5" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/svg+xml" href="assets/raven.svg" />
    <script src="runtime-config.js"></script>
    <script src="auth.js" data-page="notifications"></script>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script>
      if (window.tailwind)
        tailwind.config = {
          darkMode: 'class',
          theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } },
        };
    </script>
    <script defer src="assets/lucide.min.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body data-page="notifications">
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="sidebar-root"></div>
    <div class="workspace-main">
      <div id="topbar-root"></div>
      <main id="main" class="page-content">
        <div id="connection-banner"></div>
        <div id="page-root" aria-busy="true">
          <div class="page-heading"><div class="skeleton" style="width: 200px; height: 32px"></div></div>
          <div class="stats-grid">
            <div class="panel skeleton-card" style="height: 130px">
              <div class="skeleton"></div>
              <div class="skeleton" style="width: 40%; height: 30px"></div>
            </div>
            <div class="panel skeleton-card" style="height: 130px">
              <div class="skeleton"></div>
              <div class="skeleton" style="width: 40%; height: 30px"></div>
            </div>
            <div class="panel skeleton-card" style="height: 130px">
              <div class="skeleton"></div>
              <div class="skeleton" style="width: 40%; height: 30px"></div>
            </div>
            <div class="panel skeleton-card" style="height: 130px">
              <div class="skeleton"></div>
              <div class="skeleton" style="width: 40%; height: 30px"></div>
            </div>
          </div>
        </div>
        <footer class="workspace-footer">
          <span>ReplyRaven · Thoughtful replies. Your brand voice.</span
          ><span>Private credentials. Clear controls.</span>
        </footer>
      </main>
    </div>
    <div id="modal-root"></div>
    <div id="toast-stack" class="toast-stack" aria-live="polite"></div>
    <noscript><div class="notice warning">Enable JavaScript to use ReplyRaven.</div></noscript>
  </body>
</html>
